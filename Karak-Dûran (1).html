<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Karak-Dûran</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans+SC:wght@500;700&family=Cinzel:wght@500;700&display=swap"><style id="app-style">
/* Layout: sezione della montagna a sinistra, pannello di pergamena con il dettaglio a destra; società e gilde in schede a scala. Look unico: pietra blu notte, oro e brace di forgia. */
:root{
  --ink-0:#0d1420;
  --ink-1:#142033;
  --ink-2:#1c2b44;
  --line:#33445f;
  --fg:#efe6d2;
  --muted:#a9a495;
  --gold:#d8a94a;
  --ember:#f08436;
  --ember-deep:#a8421a;
  --water:#58b4e8;
  --holy:#cfe9ff;
  --stone-hi:#9fb0c8;
  --rock-a:#55657f;
  --rock-b:#2b374b;
  --rock-c:#172030;
  --parch:#e9ddc3;
  --parch-2:#dccfae;
  --parch-field:#f4ecd8;
  --parch-ink:#2b2218;
  --parch-muted:#6a5a43;
  --parch-line:#b9a57e;
  --f-display:'Cinzel',Georgia,'Times New Roman',serif;
  --f-body:'Alegreya',Georgia,'Times New Roman',serif;
  --f-label:'Alegreya Sans SC','Alegreya',Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink-0)}
body{
  background-color:var(--ink-0);
  background-image:radial-gradient(900px 480px at 78% -8%,#1f3050 0,transparent 62%);
  background-repeat:no-repeat;
  color:var(--fg);
  font-family:var(--f-body);
  font-size:17px;
  line-height:1.5;
  padding-block:20px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1180px;margin:0 auto}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}

/* intestazione */
.hdr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:14px 28px;align-items:end;padding-bottom:20px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-size:clamp(2.2rem,7vw,3.9rem);letter-spacing:.02em;color:var(--gold);line-height:1.05}
.sub{font-family:var(--f-display);font-weight:500;letter-spacing:.24em;text-transform:uppercase;font-size:clamp(.8rem,2.4vw,1.05rem);margin-top:6px}
.tag{font-style:italic;color:var(--muted);max-width:54ch;margin:10px 0 0}
.city{border-left:1px solid var(--line);padding-left:18px}
.city h2{font-family:var(--f-display);font-size:1.15rem;color:var(--fg);letter-spacing:.04em}
.city p{margin:4px 0 0;color:var(--muted)}
.hdr input,.hdr textarea{width:100%;background:var(--ink-2);border:1px solid var(--line);padding:8px 10px;color:var(--fg)}
.hdr input.in-h1{font-family:var(--f-display);font-size:1.7rem;color:var(--gold);font-weight:700}
.hdr .stack{display:grid;gap:8px}
@media(max-width:760px){.hdr{grid-template-columns:minmax(0,1fr)}.city{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}}

/* schede */
.tabs{display:flex;gap:2px;flex-wrap:wrap;align-items:flex-end;margin:16px 0 22px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--f-label);letter-spacing:.14em;text-transform:uppercase;font-weight:700;font-size:.92rem;padding:10px 16px;color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab[aria-selected=true]{color:var(--gold);border-bottom-color:var(--ember)}
.tabs .sp{flex:1}
.btn{font-family:var(--f-label);letter-spacing:.1em;text-transform:uppercase;font-weight:700;font-size:.82rem;padding:9px 14px;border:1px solid var(--line);background:var(--ink-2);color:var(--fg);cursor:pointer;border-radius:3px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--ember);border-color:var(--ember);color:#1a0c04}
.btn.pri:hover{background:#ff9a52}
.btn.pri[disabled]{opacity:.55;cursor:wait}
.btn.danger{border-color:var(--ember-deep);color:#ffb08a}
.parch .btn.danger{background:transparent;color:var(--ember-deep);border-color:var(--ember-deep)}
.btn.small{padding:5px 9px;font-size:.74rem}
.btn.on{border-color:var(--ember);color:var(--ember)}
.tabs .btn{margin-bottom:6px}

/* mappa */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:900px){.mapgrid{grid-template-columns:minmax(0,1fr)}}
.mapcard{background:var(--ink-1);border:1px solid var(--line);padding:8px;outline:1px solid var(--line);outline-offset:-5px}
.mapcard svg{display:block;width:100%;height:auto}
.mapcard svg.editing .pin{cursor:grab;touch-action:none}
.band{fill:rgba(0,0,0,0);cursor:pointer}
.band:hover{fill:rgba(240,132,54,.09)}
.band.on{fill:rgba(240,132,54,.15)}
.rl{font-family:var(--f-label);font-size:12.5px;font-weight:700;letter-spacing:.07em;fill:var(--muted);cursor:pointer}
.rl.on{fill:var(--ember)}
.rl.sm{font-size:10.5px;font-weight:500}
.pin{cursor:pointer;outline:none}
.pin .pbase{fill:var(--ink-1);stroke:currentColor;stroke-width:2}
.pin:hover .pbase,.pin:focus-visible .pbase{fill:var(--ink-2)}
.pin.on .pbase{fill:var(--ink-2);stroke-width:3}
.pin .ring{fill:none;stroke:var(--gold);stroke-width:2;opacity:0}
.pin.on .ring{opacity:1}
.pin:focus-visible .ring{opacity:1;stroke:var(--fg)}
.pin .sec{fill:none;stroke:var(--ember);stroke-width:1.5;stroke-dasharray:3 3}
.pin.dim{opacity:.22}
.plabel rect{fill:var(--parch);stroke:var(--parch-line)}
.plabel text{fill:var(--parch-ink);font-family:var(--f-display);font-size:12px;font-weight:700;text-anchor:middle}
.glow{transform-origin:450px 340px}
@media(prefers-reduced-motion:no-preference){.glow{animation:pulse 4.5s ease-in-out infinite}}
@keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
.scale text{font-family:var(--f-label);font-size:9px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lg{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-label);font-weight:500;font-size:.88rem;letter-spacing:.04em;padding:5px 10px 5px 8px;background:var(--ink-1);border:1px solid var(--line);cursor:pointer;border-radius:3px}
.lg:hover{border-color:var(--gold)}
.lg[aria-pressed=true]{border-color:var(--ember);background:var(--ink-2)}
.lg svg{width:16px;height:16px;flex:none}
.lg .n{color:var(--muted);font-variant-numeric:tabular-nums}
.side{position:sticky;top:12px}
@media(max-width:900px){.side{position:static}}

/* pergamena */
.parch{background:var(--parch);color:var(--parch-ink);border:1px solid var(--parch-line);padding:22px 22px 24px;box-shadow:inset 0 0 0 5px var(--parch),inset 0 0 0 6px var(--parch-line);background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(120,90,40,.08))}
.parch h2{font-family:var(--f-display);font-size:1.55rem;line-height:1.15;color:var(--parch-ink)}
.parch h3{font-family:var(--f-label);letter-spacing:.12em;text-transform:uppercase;font-size:.82rem;color:var(--parch-muted)}
.kick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem;color:var(--parch-muted);margin:0 0 8px}
.tchip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink-1)}
.tchip svg{width:16px;height:16px}
.desc{margin:10px 0 0;white-space:pre-line}
.secret{display:inline-block;margin:10px 0 0;padding:2px 10px;font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.74rem;color:#fff;background:var(--ember-deep)}
.mnote{margin-top:16px;padding-top:12px;border-top:1px dashed var(--parch-line)}
.mnote p{margin:4px 0 0;white-space:pre-line}
.zl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.zl button,.chip{font-family:var(--f-body);font-size:.95rem;padding:4px 10px;background:var(--parch-field);border:1px solid var(--parch-line);color:var(--parch-ink);cursor:pointer;border-radius:3px}
.zl button:hover,.chip:hover{border-color:var(--ember-deep)}
.hint{font-size:.9rem;color:var(--parch-muted);margin:10px 0 14px;font-style:italic}

/* campi */
.fld{display:grid;gap:4px;margin:0 0 12px}
.fld label,.chk{font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.74rem}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--parch-line);background:var(--parch-field);color:var(--parch-ink);border-radius:2px}
.fld textarea{min-height:5.2em;resize:vertical;field-sizing:content}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end}
.dark .fld label{color:var(--muted)}
.dark .fld input,.dark .fld textarea{background:var(--ink-2);border-color:var(--line);color:var(--fg)}
.dark .fld input:focus-visible,.dark .fld textarea:focus-visible{outline-color:var(--gold)}

/* elenco luoghi */
.sech{font-family:var(--f-display);font-size:1.25rem;color:var(--gold);letter-spacing:.04em;margin:30px 0 12px}
.lv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:8px 18px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.lv>button{text-align:left;background:none;border:0;padding:0;cursor:pointer;font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;color:var(--muted)}
.lv>button:hover,.lv>button.on{color:var(--ember)}
.lv ul{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.lv li button{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;background:var(--ink-1);border:1px solid var(--line);cursor:pointer;font-size:.97rem;border-radius:3px}
.lv li button:hover{border-color:var(--gold)}
.lv li button.on{border-color:var(--ember);background:var(--ink-2)}
.lv li button svg{width:15px;height:15px;flex:none}
.lv .none{color:var(--muted);font-style:italic}
@media(max-width:600px){.lv{grid-template-columns:minmax(0,1fr)}}

/* società */
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.lead{margin:0 0 20px;max-width:62ch}
.ladder{list-style:none;margin:0;padding:0}
.tier{position:relative;padding:0 0 18px 38px}
.tier::before{content:"";position:absolute;left:11px;top:14px;bottom:-14px;width:2px;background:var(--line)}
.tier:last-child::before{display:none}
.tier::after{content:"";position:absolute;left:5px;top:8px;width:14px;height:14px;background:var(--ember);transform:rotate(45deg)}
.card{background:var(--ink-1);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-5px;padding:16px 18px}
.card h3{font-family:var(--f-display);font-size:1.15rem;color:var(--gold);letter-spacing:.03em}
.card p{margin:6px 0 0}
.card .mnote{border-top-color:var(--line)}
.card .mnote h4{margin:0;font-family:var(--f-label);letter-spacing:.12em;text-transform:uppercase;font-size:.76rem;color:var(--gold)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.guilds{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.guilds .card{height:100%}
.life p{margin:10px 0 0}

/* foto e consiglio */
.ph{display:block;width:100%;max-height:260px;object-fit:cover;border:1px solid var(--line);margin:0 0 12px;background:var(--ink-2)}
.parch .ph{border-color:var(--parch-line)}
.fld .fl{font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.74rem}
.dark .fld .fl{color:var(--muted)}
.council{list-style:none;margin:0;padding:0;display:grid;gap:16px;max-width:980px}
.house{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:20px;background:var(--ink-1);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-5px;padding:20px}
@media(max-width:600px){.house{grid-template-columns:minmax(0,1fr)}.house .pt{max-width:200px}}
.pt{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line);background:var(--ink-2)}
.pt.empty{display:grid;place-items:center;color:var(--line)}
.pt.empty svg{width:46%;height:auto}
.hb{min-width:0}
.hk{margin:0;font-family:var(--f-label);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;color:var(--ember)}
.house h3{font-family:var(--f-display);font-size:1.4rem;color:var(--gold);margin:2px 0 0;letter-spacing:.02em}
.hr{margin:2px 0 0;color:var(--muted);font-variant-numeric:tabular-nums}
.dom{margin:12px 0 0}
.dom span{font-family:var(--f-label);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:.76rem;color:var(--gold);margin-right:6px}
.ht{margin:8px 0 0;max-width:62ch}
.motto{margin:12px 0 0;font-style:italic;font-size:1.1rem}
.house .mnote{border-top-color:var(--line)}
.house .mnote h4{margin:0;font-family:var(--f-label);letter-spacing:.12em;text-transform:uppercase;font-size:.76rem;color:var(--gold)}
.house .mnote p{margin:4px 0 0;white-space:pre-line}

/* cittadella reale */
.cit{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media(max-width:900px){.cit{grid-template-columns:minmax(0,1fr)}}
.cmap{margin:0;padding:8px;background:var(--ink-1);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-5px}
.cmi{position:relative}
.cmi img{display:block;width:100%;height:auto}
.cmap-empty{min-height:320px;display:grid;place-items:center;text-align:center;color:var(--muted);font-style:italic;padding:16px}
.cpin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--gold);background:var(--ink-1);color:var(--gold);font-family:var(--f-label);font-weight:700;font-size:.85rem;cursor:pointer;padding:0;display:grid;place-items:center;font-variant-numeric:tabular-nums;box-shadow:0 1px 6px rgba(0,0,0,.6)}
.cpin:hover{background:var(--ink-2)}
.cpin.on{background:var(--ember);border-color:var(--fg);color:#1a0c04;z-index:2}
.cmap.editing .cpin{cursor:grab;touch-action:none}
.alist{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:6px}
.ai{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;padding:8px 12px;background:var(--ink-1);border:1px solid var(--line);cursor:pointer;border-radius:3px}
.ai:hover{border-color:var(--gold)}
.ai.on{border-color:var(--ember);background:var(--ink-2)}
.ai .num{width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--f-label);font-weight:700;font-size:.8rem;color:var(--gold)}
.ai b{display:block;font-weight:700}
.ai .t{display:block;color:var(--muted);font-size:.95rem}
.cit2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;margin-top:28px}
.dia{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.dia li{position:relative;padding-left:20px}
.dia li::before{content:"";position:absolute;left:3px;top:.55em;width:7px;height:7px;background:var(--ember);transform:rotate(45deg)}

/* barra di salvataggio */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink-2);border-top:1px solid var(--gold);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar[hidden]{display:none}
.bar .in{max-width:1180px;margin:0 auto;display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
.bar .st{flex:1;min-width:200px;font-size:.95rem}

/_blob/86a5eeff0acce12a96d08a6f863dbbc7"}}, {"id": "s2", "name": "Il Consiglio delle Pietre", "text": "Nobiltà clanica che governa e prende le decisioni principali. È composto dai capi dei grandi clan e dai maestri delle arti arcane e metallurgiche.", "photo": {"id": "99cee42f32a7e0e547d82a43708462cf", "url": "/_blob/99cee42f32a7e0e547d82a43708462cf"}}, {"id": "s3", "name": "Le Gilde", "text": "Ogni Gilda è specializzata in un settore. Le Gilde mantengono una forte autonomia, ma sono uniti dalla fedeltà al Re-Thane e alla città.", "photo": {"id": "5d5d17ac8b27650eaf822f423894a7ce", "url": "/_blob/5d5d17ac8b27650eaf822f423894a7ce"}}, {"id": "s5", "name": "Il Popolo", "text": "La maggior parte dei nani vive nei quartieri inferiori e si dedica al lavoro, alla difesa e alla manutenzione della città."}], "guilds": [{"id": "g1", "name": "Gilda dei Forgiatori", "text": "Responsabile della produzione di metalli, armi e costrutti.", "photo": {"id": "bde9ebc5e2e7b705ee456fc9a1762600", "url": "/_blob/bde9ebc5e2e7b705ee456fc9a1762600"}}, {"id": "g2", "name": "Gilda degli Ingegneri", "text": "Si occupa delle strutture, delle macchine e delle innovazioni.", "photo": {"id": "69faca506f0e4bcc9ca58fbc35f0f14f", "url": "/_blob/69faca506f0e4bcc9ca58fbc35f0f14f"}}, {"id": "g3", "name": "Gilda dei Minatori", "text": "Gestisce l'estrazione e la sicurezza delle gallerie.", "photo": {"id": "8c3f8d8798a1089120b5b2c92f48f989", "url": "/_blob/8c3f8d8798a1089120b5b2c92f48f989"}}, {"id": "g4", "name": "Gilda dei Maestri Arcani", "text": "Studia e applica l'arte della runa e dell'incantamento.", "photo": {"id": "6605fee4d236e02156ce07265ba783a7", "url": "/_blob/6605fee4d236e02156ce07265ba783a7"}}, {"id": "g5", "name": "Gilda dei Mercanti", "text": "Si occupa di scambi, approvvigionamenti e relazioni con l'esterno.", "photo": {"id": "deb1935017d7fd56df8191b97ba5ff81", "url": "/_blob/deb1935017d7fd56df8191b97ba5ff81"}}, {"id": "g6", "name": "Gilda dei Custodi", "text": "Mantiene l'ordine, la sicur le": "Capocasata", "age": "204", "domain": "esercito, addestramento e spedizioni", "text": "Famiglia di tradizione guerriera, famosa per aver fornito generazioni di ufficiali e comandanti. Brynja è una combattente pragmatica, poco interessata alle dispute aristocratiche, ma estremamente influente nelle questioni militari.", "motto": "Il ferro si piega, noi no", "photo": {"id": "365a487884fc53c864e39f163ca8e128", "url": "/_blob/365a487884fc53c864e39f163ca8e128"}}, {"id": "c5", "house": "Casata Azh-Mor", "name": "Lord Tharvok Azh-Mor", "role": "Capocasata", "age": "276", "domain": "conoscenza, magia e ricerca", "text": "La casata ha prodotto alcuni dei più grandi studiosi nanici. Detiene biblioteche private, archivi runici e antichi trattati di magia. Tharvok è un uomo enigmatico, convinto che alcune conoscenze debbano rimanere accessibili soltanto a pochi eletti.", "motto": "La conoscenza è il fuoco che non si spegne", "photo": {"id": "485d4326dff3a51ee2a4a6ffb1ecc59a", "url": "/_blob/485d4326dff3a51ee2a4a6ffb1ecc59a"}}], "citTitle": "La Cittadella Reale", "citIntro": "La Cittadella Reale di Karak-Dûran sorge nel punto più alto della città, incarnando il potere, la tradizione e la memoria dei nani. Qui risiede il Re-Thane e si riunisce il Consiglio delle Pietre in una serie di sale monumentali, ricche di simboli e storia.", "citFeatures": "Architettura monumentale in granito e pietra nera\nSimboli delle casate e di Moradin ovunque\nIlluminazione con bracieri e lampade runiche\nAccesso sorvegliato e riservato", "citAtmos": "Ambiente solenne e imponente, permeato di storia\nAtmosfera di ordine, disciplina e tradizione\nSimboli runici e decorazioni in ogni sala\nPresenza costante di guardie e servitori reali", "citmap": [{"id": "m1", "name": "Pianta della Cittadella Reale", "photo": {"id": "6272bccba847d3bbc76eb0f1736ff6dd", "url": "/_blob/6272bccba847d3bbc76eb0f1736ff6dd"}}], "citAreas": [{"id": "a1", "name": "Ingresso alla Cittadella Reale", "text": "Imponente scalina   });
  /* segnaposto */
  var selLoc=null;
  S.locations.forEach(function(l){

  h+='<text x="0" y="-4">0</text><text x="120" y="-4" text-anchor="end">500 m</text></g>';
  h+='</svg>';

  return '<div class="fld"><span class="fl">Foto</span>'+photoImg(it)+photoCtl(coll,it)+'</div>';

function prep(file){
  return createImageBitmap(file).then(function(bmp){
    var k=Math.min(1,1400/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(bmp.width*k));c.height=Math.max(1,Math.round(bmp.height*k));
    var g=c.getContext('2d');g.fillStyle='#142033';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
    return new Promise(function(res){c.toBlob(function(b){res(b||file)},'image/jpeg',0.88)});
  }).catch(function(){return file});
}
var fin=document.createElement('input');
fin.type='file';fin.accept='image/*';fin.hidden=true;fin.id='photo-in';fin.setAttribute('aria-label','Scegli una foto');
document.body.appendChild(fin);
fin.addEventListener('change',function(){
  var f=fin.files&&fin.files[0],t=photoTarget;
  if(!f||!t||!ASSETS)return;
  if(!/^image\//.test(f.type)){msg='Scegli un file immagine.';msgErr=true;renderBar();return}
  uploading=true;msg='Caricamento della foto...';msgErr=false;render();
  prep(f).then(function(b){return ASSETS.upload(b)}).then(function(r){
    var it=byId(t.coll,t.id);
    uploading=false;
    if(it){it.photo={id:r.id,url:r.url};if(t.coll==='custodi')wMember(it,true);else if(it.hid)wHid(t.coll,it,true);else setDirty()}
    msg=t.coll==='custodi'?'Foto caricata e salvata.':'Foto caricata. Premi Salva per tenerla nella pagina.';msgErr=false;render();
  }).catch(function(e){
    uploading=false;msgErr=true;
    msg='Caricamento non riuscito'+(e&&e.code==='rate_limited'?': troppe richieste, riprova tra poco.':'. Controlla che il file sia un\'immagine e riprova.');
    render();
  });
});

/* salvataggio */
function buildDoc(){
  var pub=Object.assign({},S);delete pub.custodi;delete pub.custodiTitle;delete pub.custodiIntro;
  NCOLL.forEach(function(c){pub[c]=S[c].filter(function(it){return !it.hid}).map(function(it){var o=Object.assign({},it);delete o.notes;return o})});
  var json=JSON.stringify(pub).replace(/</g,'\\u003c');
  var css=$('#app-style').textContent,js=$('#app-script').textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+CL+'style>'+CL+'head><body>'+HEAD+'<style id="app-style">'+css+CL+'style><div id="app">'+CL+'div><script type="application/json" id="state">'+json+CL+'script><script id="app-script">'+js+CL+'script>'+CL+'body>'+CL+'html>';
}
function save(){
  if(saving||!dirty)return;
  if(!ART){msg='Il salvataggio non è disponibile in questa vista.';msgErr=true;renderBar();return}
  saving=true;msg='';msgErr=false;renderBar();
  store('kd-sel',JSON.stringify(sel));store('kd-draft',null);
  var doc;
  try{doc=buildDoc()}catch(e){saving=false;msg='Non sono riuscito a preparare la pagina.';msgErr=true;renderBar();return}
  ART.publish(doc).then(function(){
    dirty=false;saving=false;msg='Salvato.';renderBar();
  }).catch(function(e){
    saving=false;msgErr=true;
    var c=e&&e.code;
    if(c==='conflict'){store('kd-draft',JSON.stringify(S));msg='Qualcun altro ha salvato prima di te. La pagina si ricarica e la tua bozza resta da parte.'}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){msg='Questa vista è in sola lettura: possono salvare solo le persone con accesso in modifica.'}
    else if(c==='too_large'){msg='La pagina è diventata troppo grande per essere salvata.'}
    else if(c==='rate_limited'){msg='Troppi salvataggi ravvicinati. Aspetta qualche secondo e riprova.'}
    else{msg='Salvataggio non riuscito. Riprova tra poco.'}
    renderBar();
  });
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function act(el,e){
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id'),coll=el.getAttribute('data-coll');
  if(a==='tab'){location.hash=id;return}
  if(a==='sel'){sel={k:'loc',id:id};store('kd-sel',JSON.stringify(sel));render();return}
  if(a==='selz'){sel={k:'zone',id:id};store('kd-sel',JSON.stringify(sel));render();return}
  if(a==='filter'){filter=filter===id?null:id;refreshMap();return}
  if(a==='edit'){edit=!edit;armed=null;msg='';render();return}
  if(a==='csel'){csel=id;render();return}
  if(a==='photo'){if(uploading||!ASSETS)return;photoTarget={coll:coll,id:id};fin.value='';fin.click();return}
  if(a==='rmphoto'){var pit=byId(coll,id);if(pit){pit.photo=null;if(coll==='custodi')wMember(pit,true);else if(pit.hid)wHid(coll,pit,true);else setDirty();render()}return}
  if(a==='revealh'){var hit=byId(coll,id);if(!hit||!ISOWNER||!hit.hid)return;hit.revealed=!hit.revealed;wHid(coll,hit,true);render();return}
  if(a==='reveal'){var rit=byId('custodi',id);if(!rit||!ISOWNER)return;rit.revealed=!rit.revealed;wMember(rit,true);render();return}
  if(a==='save'){save();return}
  if(a==='revert'){S=keepK(JSON.parse($('#state').textContent));dirty=false;msg='';armed=null;render();return}
  if(a==='restore'){S=keepK(draft);draft=null;store('kd-draft',null);dirty=true;edit=true;msg='Bozza ripresa.';render();return}
  if(a==='dropdraft'){draft=null;store('kd-draft',null);renderBar();return}
  if(a==='addloc'){
    var nl={id:uid('l'),name:'Nuovo luogo',type:'building',x:450,y:250,desc:'',notes:'',secret:false};
    S.locations.push(nl);sel={k:'loc',id:nl.id};setDirty();render();return;
  }
  if(a==='delloc'){
    if(armed==='loc:'+id){var dl=byId('locations',id);S.locations=S.locations.filter(function(l){return l.id!==id});armed=null;if(dl&&dl.hid)wHidDelete('locations',id);else{setDirty();wNotes()}render();return}
    armed='loc:'+id;render();setTimeout(function(){if(armed==='loc:'+id){armed=null;render()}},3500);return;
  }
  if(a==='additem'){
    var it=coll==='citAreas'?{id:uid('a'),name:'Nuova area',text:'',x:50,y:50,photo:null}:coll==='custodi'?{id:uid('k'),name:'Nuovo custode',title:'',race:'Nano',age:'',text:'',notes:'',photo:null}:coll==='council'?{id:uid('c'),house:'Nuova casata',name:'',role:'Capocasata',age:'',domain:'',text:'',motto:'',notes:'',photo:null}:{id:uid(coll==='guilds'?'g':'s'),name:coll==='guilds'?'Nuova gilda':'Nuovo grado',text:'',notes:''};
    S[coll].push(it);if(coll==='citAreas')csel=it.id;if(coll==='custodi')wMember(it,true);else setDirty();render();
    var f=$('#n-'+it.id);if(f)f.focus();return;
  }
  if(a==='delitem'){
    var key=coll+':'+id;
    if(armed===key){var di=byId(coll,id);S[coll]=S[coll].filter(function(x){return x.id!==id});armed=null;if(coll==='custodi')wDelete(id);else if(di&&di.hid)wHidDelete(coll,id);else{setDirty();wNotes()}render();return}
    armed=key;render();setTimeout(function(){if(armed===key){armed=null;render()}},3500);return;
  }
  if(a==='mv'){
    var d=parseInt(el.getAttribute('data-d'),10),arr=S[coll],i=arr.map(function(x){return x.id}).indexOf(id),j=i+d;
    if(i<0||j<0||j>=arr.length)return;
    var t=arr[i];arr[i]=arr[j];arr[j]=t;if(coll==='custodi')wOrder();else{setDirty();wHidOrder(coll)}render();
    return;
  }
}

/* custodi: database privato (solo il proprietario legge 'secret'; 'revealed' e' cio' che hai mostrato ai giocatori) */

function mergeHid(pub,hl){var out=pub.slice();hl.slice().sort(function(a,b){return (a.idx||0)-(b.idx||0)}).forEach(function(h){out.splice(Math.min(h.idx||0,out.length),0,h.it)});return out}
function hidItem(it,withNotes){var o=Object.assign({},it);delete o.hid;delete o.revealed;if(!withNotes)delete o.notes;return o}
function wHid(c,it,now){
  if(!DB||!ISOWNER)return;
  var key='h'+c+it.id,did='hid_'+c+'_'+it.id;
  var go=function(){
    delete kTmr[key];
    var i=S[c].indexOf(it);if(i<0)return;
    var rv=!!it.revealed,sd={coll:c,idx:i,revealed:rv,item:hidItem(it,true)},pd={coll:c,idx:i,item:hidItem(it,false)};
    kq('s'+did,function(){return DB.doc('secret/'+did).set(sd)});
    kq('r'+did,function(){return rv?DB.doc('revealed/'+did).set(pd):DB.doc('revealed/'+did).delete()});
  };
  clearTimeout(kTmr[key]);
  if(now){go();return}
  kTmr[key]=setTimeout(go,800);kMsg('Salvataggio...');
}
function wHidDelete(c,id){
  if(!DB||!ISOWNER)return;var did='hid_'+c+'_'+id;
  kq('s'+did,function(){return DB.doc('secret/'+did).delete()});
  kq('r'+did,function(){return DB.doc('revealed/'+did).delete()});
}
function wHidOrder(c){S[c].forEach(function(it){if(it.hid)wHid(c,it,true)})}
function hidBar(c,it){
  if(!ISOWNER||!it.hid)return '';
  return '<div class="ctl" style="margin:0 0 12px;align-items:center"><span class="secret" style="margin:0'+(it.revealed?';background:#2f6b3a':'')+'">'+(it.revealed?'Rivelato ai giocatori':'Nascosto ai giocatori')+'</span><button class="btn small'+(it.revealed?' danger':' pri')+'" data-act="revealh" data-coll="'+c+'" data-id="'+it.id+'">'+(it.revealed?'Nascondi di nuovo':'Rivela ai giocatori')+'</button></div>';
}
function collectNotes(){var o={};NCOLL.forEach(function(c){o[c]={};S[c].forEach(function(it){if(it.notes&&!it.hid)o[c][it.id]=it.notes})});return o}
function wNotes(){
  if(!DB||!ISOWNER)return;
  clearTimeout(kTmr.notes);
  kTmr.notes=setTimeout(function(){
    delete kTmr.notes;
    var d=collectNotes();
    kq('snotes',function(){return DB.doc('secret/notes').set(d)});
  },800);kMsg('Salvataggio note...');
}
function keepK(n){var nm=collectNotes();NCOLL.forEach(function(c){var hl=[];S[c].forEach(function(it,i){if(it.hid)hl.push({idx:i,it:it})});(n[c]||[]).forEach(function(it){it.notes=nm[c][it.id]||''});n[c]=mergeHid(n[c]||[],hl)});n.custodi=S.custodi;n.custodiTitle=S.custodiTitle;n.custodiIntro=S.custodiIntro;return n}
function kMsg(t,err){var e=$('#bst');if(e){e.textContent=t;e.style.color=err?'#ffb08a':''}else if(err||edit){msg=t;msgErr=!!err;renderBar()}}
function kq(key,fn){
  kInfl++;
  kChain[key]=(kChain[key]||Promise.resolve()).then(fn).catch(function(){kMsg('Salvataggio non riuscito. Riprova tra poco.',true)}).then(function(){kInfl--;if(!kInfl&&!Object.keys(kTmr).length)kMsg('Salvato nel database segreto.')});
  return kChain[key];
}
function sDoc(it,i){return {order:i,name:it.name||'',title:it.title||'',race:it.race||'',age:it.age||'',text:it.text||'',notes:it.notes||'',photo:it.photo||null,revealed:!!it.revealed}}
function pDoc(it,i){return {order:i,name:it.name||'',title:it.title||'',race:it.race||'',age:it.age||'',text:it.text||'',photo:it.photo||null}}
function wRevMeta(){
  if(!DB)return;
  var any=S.custodi.some(function(x){return x.revealed});
  kq('rm',function(){return any?DB.doc('revealed/meta').set({title:S.custodiTitle||'',intro:S.custodiIntro||''}):DB.doc('revealed/meta').delete()});
}
function wMember(it,now){
  if(!DB||!ISOWNER)return;
  var key='m'+it.id;
  var go=function(){
    delete kTmr[key];
    var i=S.custodi.indexOf(it);if(i<0)return;
    var sd=sDoc(it,i),pd=pDoc(it,i),rv=!!it.revealed;
    kq('s'+it.id,function(){return DB.doc('secret/'+it.id).set(sd)});
    kq('r'+it.id,function(){return rv?DB.doc('revealed/'+it.id).set(pd):DB.doc('revealed/'+it.id).delete()});
    wRevMeta();
  };
  clearTimeout(kTmr[key]);
  if(now){go();return}
  kTmr[key]=setTimeout(go,800);kMsg('Salvataggio...');
}
function wMeta(){
  if(!DB||!ISOWNER)return;
  clearTimeout(kTmr.meta);
  kTmr.meta=setTimeout(function(){
    delete kTmr.meta;
    var t=S.custodiTitle||'',n=S.custodiIntro||'';
    kq('smeta',function(){return DB.doc('secret/meta').set({title:t,intro:n})});
    wRevMeta();
  },800);kMsg('Salvataggio...');
}
function wOrder(){S.custodi.forEach(function(it){wMember(it,true)})}
function wDelete(id){
  if(!DB||!ISOWNER)return;
  kq('s'+id,function(){return DB.doc('secret/'+id).delete()});
  kq('r'+id,function(){return DB.doc('revealed/'+id).delete()});
  wRevMeta();
}
function kApply(snap,owner){
  var list=[],meta=null,nm=null,hl=[];
  snap.docs.forEach(function(d){
    var x=d.data()||{};
    if(d.id==='meta'){meta=x;return}
    if(d.id==='notes'){nm=x;return}
    if(d.id.indexOf('hid_')===0){var hi=Object.assign({},x.item||{});hi.hid=true;hi.revealed=owner?!!x.revealed:true;if(!owner)delete hi.notes;hl.push({c:x.coll,idx:x.idx,it:hi});return}
    var o={id:d.id};Object.keys(x).forEach(function(k){o[k]=x[k]});
    if(!owner)o.revealed=true;
    list.push(o);
  });
  list.sort(function(a,b){return (a.order||0)-(b.order||0)});
  var was=kLoaded;kLoaded=true;kErr='';
  if(kInfl||Object.keys(kTmr).length)return;
  var ot=S.custodiTitle,oi=S.custodiIntro;
  if(meta){S.custodiTitle=meta.title||S.custodiTitle;S.custodiIntro=meta.intro||''}
  var sig=function(a){return JSON.stringify(a)};
  var nch=false;
  if(owner&&nm)NCOLL.forEach(function(c){S[c].forEach(function(it){if(it.hid)return;var v=(nm[c]&&nm[c][it.id])||'';if((it.notes||'')!==v){it.notes=v;nch=true}})});
  var mg={};NCOLL.forEach(function(c){mg[c]=mergeHid(S[c].filter(function(x){return !x.hid}),hl.filter(function(h){return h.c===c}))});
  var hs=function(L){return JSON.stringify(NCOLL.map(function(c){return L[c].map(function(it,i){return it.hid?[i,it.id,it.name,it.text,it.desc,it.notes,it.revealed,it.x,it.y,it.type,it.secret,it.photo&&it.photo.id]:0})}))};
  var hch=hs(mg)!==hs(S);
  var changed=hch||nch||sig(list)!==sig(S.custodi)||ot!==S.custodiTitle||oi!==S.custodiIntro||!was;
  if(!changed)return;
  S.custodi=list;
  if(hch)NCOLL.forEach(function(c){S[c]=mg[c]});
  var ae=document.activeElement;
  if(ae&&app.contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName))return;
  tab=tabFromHash();render();
}
function kInit(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    DB=r[0];var u=r[1];
    return (u?u.isOwner():Promise.resolve(false)).then(function(o){
      ISOWNER=!!o;
      if(!DB){if(ISOWNER){kErr='Database non disponibile.';render()}return}
      var onErr=function(){kErr='Non riesco a leggere i Custodi.';if(tab==='brace')render()};
      if(ISOWNER){render();DB.collection('secret').onSnapshot(function(s){kApply(s,true)},onErr)}
      else DB.collection('revealed').onSnapshot(function(s){kApply(s,false)},function(){});
    });
  }).catch(function(){});
}
window.addEventListener('hashchange',function(){tab=tabFromHash();render()});
render();kInit();
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(a){ART=a;if(a&&!dirty)render();else renderBar()}).catch(function(){});
  window.claude.use('assets').then(function(a){ASSETS=a;if(a&&edit&&!uploading)render()}).catch(function(){});
}
})();
